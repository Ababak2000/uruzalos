# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: uruzalos
description: This is my personal OS image.

base-image: ghcr.io/ublue-os/silverblue-main
image-version: "44"

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: bling
    install:
      - rpmfusion

  - type: akmods
    base: main
    nvidia-driver: nvidia-open
    install:
      - v4l2loopback

  - type: dnf
    install:
      packages:
        - starship
        - vim-enhanced
        - neovim
        - fastfetch
        - ripgrep
        - fd-find
        - git
        - distrobox
        - niri
        - noctalia
        - ly
        - xdg-desktop-portal-gnome
        - ffmpeg
        - libva-utils
        - pipewire-utils
        - playerctl
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: systemd
    system:
      enabled:
        - ly.service
      disabled:
        - gdm.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - org.freedesktop.Platform.ffmpeg-full
      - scope: user

  - type: signing

# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: uruzalos
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: latest

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: bling
    install:
      - rpmfusion

  - type: akmods
    install:
      - nvidia-driver: nvidia-open

  - type: dnf
    install:
      packages:
        # Editoren & Tools
        - starship
        - vim-enhanced
        - neovim
        - fastfetch
        - ripgrep
        - fd-find
        - git
        - distrobox

        # Desktop Environment, Shell & Display Manager
        - niri
        - noctalia
        - ly
        - xdg-desktop-portal-gnome

        # Multimedia, Codecs & Audio-Tools
        - ffmpeg
        - libva-utils
        - pipewire-utils
        - playerctl
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: systemd
    system:
      enabled:
        - ly.service
      disabled:
        - gdm.service

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - org.freedesktop.Platform.ffmpeg-full
      - scope: user

  - type: signing
